<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ef4444" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/styles.css?v=5" />
    <title>진주 버스</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" aria-label="버스 위치 지도">
        <div id="map"></div>
      </section>

      <section class="control-panel">
        <div class="input-row">
          <label>
            <span>노선 번호</span>
            <input id="busInput" inputmode="text" autocomplete="off" />
          </label>
          <button id="refresh">새로고침</button>
        </div>

        <div class="status-row">
          <span id="routeCount">-</span>
          <span id="vehicleCount">-</span>
          <span id="statusText">준비</span>
        </div>

        <section class="results" id="results" aria-live="polite"></section>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app.js?v=5" type="module"></script>
  </body>
</html>
