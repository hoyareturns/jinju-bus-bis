services:
  bus:
    build:
      context: ..
      dockerfile: mobile_app/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TAGO_API_KEY: ${TAGO_API_KEY:-}
      CITY_CODE: ${CITY_CODE:-38030}
      BUS_BASE_PATH: ${BUS_BASE_PATH:-/apps/bus/}
      HUB_PATH: ${HUB_PATH:-/}
      BUS_PUBLIC_ORIGIN: ${BUS_PUBLIC_ORIGIN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BUS_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8765
    volumes:
      - bus-alerts:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  bus-alerts:
